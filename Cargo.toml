[package]
name = "lemonyde"
version = "2.0.0"
edition = "2021"
description = "Unofficial community bootstrapper & FFlag editor for the Sober flatpak (Roblox on Linux)"
license = "MIT"

[[bin]]
name = "lemonyde"
path = "src/main.rs"

[dependencies]
# Pinned to the 0.9.x / 0.7.x compatible line (glib/gio 0.20, GTK 4.14+,
# libadwaita 1.5+). Bump these together if you want a newer gtk4-rs release —
# gtk4, libadwaita, glib and gio versions must be updated as a set.
gtk4 = { version = "~0.9", package = "gtk4", features = ["v4_10"] }
libadwaita = { version = "~0.7", package = "libadwaita", features = ["v1_5"] }
glib = "~0.20"
gio = "~0.20"
serde_json = "1"
dirs = "5"
async-channel = "2"
image = "0.25"

[profile.release]
opt-level = "z"
lto = true
strip = true
